<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e4f">
  <title>사우디 통역기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🇰🇷 ⇄ 🇸🇦 사우디 통역기</h1>
    <div class="topbar-actions">
      <button id="faceBtn" class="icon-btn" title="마주보기 모드">⇅</button>
      <button id="settingsBtn" class="icon-btn" title="설정">⚙</button>
    </div>
  </header>

  <main id="app">
    <!-- 상대방(사우디) 쪽: 마주보기 모드에서 180° 회전 -->
    <section class="pane pane-ar" id="paneAr">
      <div class="pane-head">
        <span class="lang-tag">العربية (السعودية)</span>
        <label class="mini"><input type="checkbox" id="autoSpeak" checked> 자동 읽기</label>
      </div>
      <div class="log" id="logAr" dir="rtl" aria-live="polite"></div>
      <div class="input-row" dir="rtl">
        <button class="mic" id="micAr" data-lang="ar" aria-label="아랍어로 말하기">🎤<span>تكلّم</span></button>
        <textarea id="textAr" rows="2" placeholder="اكتب هنا…" dir="rtl"></textarea>
        <button class="send" id="sendAr">ترجم</button>
      </div>
    </section>

    <section class="pane pane-ko" id="paneKo">
      <div class="pane-head">
        <span class="lang-tag">한국어</span>
        <span class="status" id="status"></span>
      </div>
      <div class="log" id="logKo" aria-live="polite"></div>
      <div class="input-row">
        <button class="mic" id="micKo" data-lang="ko" aria-label="한국어로 말하기">🎤<span>말하기</span></button>
        <textarea id="textKo" rows="2" placeholder="한국어로 입력하거나 마이크를 누르세요"></textarea>
        <button class="send" id="sendKo">통역</button>
      </div>
      <div class="phrases" id="phrases"></div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>설정</h2>
      <label>Anthropic API 키
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      </label>
      <p class="hint">키는 이 브라우저(localStorage)에만 저장되고 api.anthropic.com 으로만 전송됩니다.</p>
      <label>모델
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (최고 품질)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (균형)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (가장 빠름·저렴)</option>
        </select>
      </label>
      <label>아랍어 스타일
        <select id="dialect">
          <option value="najdi">사우디 구어 – 나즈드(리야드)</option>
          <option value="hijazi">사우디 구어 – 히자즈(제다·메카)</option>
          <option value="msa">표준 아랍어 (فصحى)</option>
        </select>
      </label>
      <label>말투
        <select id="register">
          <option value="polite">공손하게 (비즈니스·처음 만난 사람)</option>
          <option value="casual">편하게 (친구)</option>
        </select>
      </label>
      <label>말하는 속도
        <input type="range" id="rate" min="0.6" max="1.3" step="0.1" value="0.9">
      </label>
      <menu>
        <button value="clear" id="clearLog" class="ghost">대화 지우기</button>
        <button value="ok" class="primary">저장</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
